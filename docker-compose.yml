services:
  meter-data-service:
    image: meter-data-service:local
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__MeterData: "Host=postgres;Database=meter_data;Username=mds;Password=mds_dev"
    depends_on:
      postgres:
        condition: service_healthy

  edifact-parser:
    image: edifact-energy-parser:local
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MeterDataService__BaseUrl: "http://meter-data-service:8080"

  billing-engine:
    image: energy-billing-engine:local
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      BillingEngine__Database: sqlserver
      ConnectionStrings__Billing: "Server=sqlserver;Database=billing;User Id=sa;Password=Billing_Dev_2026!;TrustServerCertificate=true"
    depends_on:
      sqlserver:
        condition: service_healthy

  portal-api:
    build:
      context: .
      dockerfile: src/EnergyPortal.Api/Dockerfile
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Services__MeterData: "http://meter-data-service:8080"
      Services__EdifactParser: "http://edifact-parser:8080"
      Services__BillingEngine: "http://billing-engine:8080"

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - portal-api

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mds
      POSTGRES_PASSWORD: mds_dev
      POSTGRES_DB: meter_data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mds -d meter_data"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Billing_Dev_2026!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Billing_Dev_2026!' -Q 'SELECT 1'"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  sqlserver_data:
